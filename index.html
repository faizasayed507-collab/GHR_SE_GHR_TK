<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghar Se Ghar Tak - Homepreneur Escrow Marketplace</title>
    <!-- Use an inline SVG data URI favicon to avoid 404s on Vercel if favicon.ico is missing -->
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FFF9F5'/><text x='50' y='60' font-size='56' text-anchor='middle' fill='%234A3F35' font-family='Inter, Arial, sans-serif'>G</text></svg>" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFF9F5] text-[#4A3F35] font-sans antialiased">
    <div id="root"></div>
    <!-- Provide a minimal global fallback to avoid Uncaught ReferenceError for showSellerPassword
         if some component or inline script references it before React mounts. This ensures the
         identifier exists and can be toggled without crashing. -->
    <script>
      // global fallback (kept minimal). Components should still declare state internally.
      window.showSellerPassword = false;
      window.setShowSellerPassword = function (val) { window.showSellerPassword = !!val; };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
